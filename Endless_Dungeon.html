<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Endless Dungeon</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" width="1280" height="720" aria-label="Endless Dungeon"></canvas>
      <div id="screenTransitionOverlay" class="transition-overlay hidden"></div>

      <section id="pauseScreen" class="overlay hidden" aria-label="Jogo pausado">
        <div class="title-panel pause-panel">
          <h1>Jogo pausado</h1>
          <p>Pressione ESC ou P para continuar</p>
        </div>
      </section>

      <!-- TELA DE INTRODUÇÃO -->
      <section id="introScreen" class="overlay">
        <div id="fadeScreen">
          <p id="fadePrompt">Aperte qualquer botão para iniciar o jogo</p>
        </div>
      </section>

      <!-- MENU PRINCIPAL -->
      <section id="startScreen" class="overlay hidden">
        <div class="title-panel menu-panel">
          <h1>Endless Dungeon</h1>
          <p>Escolha um modo de jogo para começar.</p>

          <div class="mode-buttons">
            <button id="startGame" type="button" class="mode-btn">
              <span class="mode-icon" aria-hidden="true">
                <img src="src/assets/survival_mode_icon.png"
                    alt=""
                    width="40"
                    height="40"
                    style="vertical-align: middle;">
              </span>
              <span class="mode-title">Modo Sobrevivencia</span>
              <span class="mode-desc">
                Enfrente hordas infinitas de monstros, colete orbes e sobreviva o maximo que puder.
              </span>
            </button>

            <button id="duelMode" type="button" class="mode-btn">
              <span class="mode-badge">Beta</span>

              <span class="mode-icon" aria-hidden="true">
                <img src="src/assets/duel_mode_icon.png"
                    alt=""
                    width="40"
                    height="40"
                    style="vertical-align: middle;">
              </span>

              <span class="mode-title">Modo Duelo</span>

              <span class="mode-desc">
                Enfrente um guerreiro em um duelo mortal. Sem upgrades, apenas 3 frascos de vida.
              </span>
            </button>
          </div>
        </div>
        <div class="audioOptions">
          <label>
              <input type="checkbox" id="musicToggle" checked>
              Música
          </label>

          <label>
              <input type="checkbox" id="sfxToggle" checked>
              Efeitos Sonoros
          </label>
        </div>
      </section>

      <section id="gameOverOverlay" class="overlay hidden">
        <div id="gameOverModal" class="modal hidden">
          <div class="modal-content">
            
            <div id="finalStats" class="stats-container">
              <!-- As estatísticas serão inseridas dinamicamente pelo JavaScript -->
            </div>

            <div class="modal-actions">
              <button id="restartGame" class="btn primary">Recomeçar</button>
              <button id="backToMenu" class="btn secondary">Voltar ao menu inicial</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  
  </body>
</html>
